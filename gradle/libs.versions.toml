[versions]
androidGradlePlugin = "9.0.1"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.03.01"
# m3-expressive A.1 — pin material3 to 1.5.0-alpha18, the alpha that
# promotes `MaterialExpressiveTheme` / `expressiveLightColorScheme` to
# public API. The 1.4.0 stable line (resolved by the BOM above) keeps
# these `internal` — Kotlin metadata marks them `internal` even though
# the JVM bytecode is public. Override at the artifact level so the
# BOM still governs every other Compose artifact. Note:
# `expressiveDarkColorScheme()` does NOT exist in alpha18 — only the
# light factory ships; dark stays on `darkColorScheme(...)` and
# inherits the surface ladder. Drop this override once 1.5.0 stable
# ships and the BOM picks it up.
composeMaterial3 = "1.5.0-alpha18"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
coroutines = "1.10.2"
junit = "4.13.2"
kotlin = "2.3.20"
nav3Core = "1.0.1"
lifecycleViewmodelNav3 = "2.10.0"
kotlinxSerialization = "1.7.3"
# oss-licenses A.1 — Cash App's Licensee plugin. Walks the resolved
# runtime classpath at configuration time, writes a JSON inventory to
# `app/build/reports/licensee/android<Variant>/artifacts.json`. Apache-2.0
# itself (build-only, never shipped in the APK).
licensee = "1.13.0"
# Robolectric — JVM-side Android shadows so `Context`-dependent unit tests
# run without an emulator. 4.14.1 is the current stable line (May 2026)
# and supports `@Config(sdk = [34])`. Pairs with `androidx.test:core-ktx`
# + `ext:junit-ktx` for the AndroidX test runner shims; Compose UI tests
# under Robolectric reuse the `androidx.compose.ui:ui-test-junit4`
# artifact already declared via the Compose BOM, plus the
# `ui-test-manifest` sibling for the host harness.
robolectric = "4.14.1"
androidxTestCoreKtx = "1.6.1"
androidxTestExtJunitKtx = "1.2.1"
# Phase B — Room (KSP-generated DAOs), DataStore Preferences, DocumentFile (SAF).
# All Apache-2.0; family allowlist already permits them, no Licensee gate
# changes required.
room = "2.8.0"
# KSP2 uses standalone versioning decoupled from Kotlin; 2.3.8 is the
# latest stable line at May 2026 and binary-compatible with Kotlin 2.3.20.
ksp = "2.3.8"
datastore = "1.1.7"
documentfile = "1.1.0"
# Phase D — commonmark-java 0.28.0 (released 2026-03-31). BSD-2-Clause; the
# Licensee allowlist (Phase A) already permits BSD-2-Clause. Six GFM
# extensions ship in v1; YAML front-matter is sniffed by a DIY ~40-LOC
# pass before the body reaches commonmark — avoids the snakeyaml-engine
# transitive (~150 KB minified). See docs/plans/format-markdown.md.
commonmark = "0.28.0"

# Phase I/J — Apache POI for DOCX (XWPF) + XLSX (XSSF) renderers. POI is
# Apache-2.0 and on the family Licensee allowlist. We pull the stock
# poi-ooxml + poi-scratchpad and pair them with com.fasterxml:aalto-xml as
# the StAX impl (Android ships javax.xml.stream factory absent). Three
# `org.apache.poi.javax.xml.stream.*` system properties are set in
# PageboyApplication.onCreate() to wire POI to aalto before any
# XMLInputFactory lookup. See docs/plans/format-{docx,xlsx}.md.
#
# Why not the centic9/poi-on-android `poishadow-all` rebuild: that project
# ships a downloadable jar but no Maven artifact; vendoring it into
# buildSrc is heavier than the version-pinned stock POI approach which now
# works on Android with the StAX bootstrap + a couple of packaging
# excludes for the duplicate-license META-INF jank XmlBeans ships.
poi = "5.5.1"
aaltoXml = "1.3.3"
# excel-streaming-reader (formerly monitorjbl, now pjfanning/excel-streaming-reader
# — the active maintained fork). Layered on top of POI for windowed row
# reading on large XLSX workbooks. Apache-2.0.
xlsxStreamer = "5.2.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
# m3-expressive A.1 — pinned override (see version-block comment).
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
# material-icons-extended — needed for non-core glyphs (MenuBook, History,
# PushPin, MoreVert, Settings, etc.) used across the nav rail / settings /
# about chrome. Not transitive in material3 1.4.0+ (m3-expressive.md gotcha #2).
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended"}
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"}
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"}
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
# Robolectric + AndroidX test core-ktx / ext-junit-ktx — JVM-only Android-shadow
# host that lets `Context`-dependent unit tests (AssetManager / the Compose
# `createComposeRule()` harness) run on `./gradlew :app:testDebugUnitTest`
# without an emulator. `@Config(sdk = [34])` per test class.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCoreKtx" }
androidx-test-ext-junit-ktx = { module = "androidx.test.ext:junit-ktx", version.ref = "androidxTestExtJunitKtx" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Phase B — Room (document cache), DataStore Preferences (UI prefs + library
# roots), DocumentFile (SAF tree walking). All Apache-2.0.
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

# Phase D — commonmark-java core + the six GFM extensions Phase D ships.
# All BSD-2-Clause; on the Licensee allowlist. The yaml-front-matter
# extension is deliberately excluded — see format-markdown.md APK-budget
# section + the AppGraph wiring comments.
commonmark-core = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-ext-task-list-items = { module = "org.commonmark:commonmark-ext-task-list-items", version.ref = "commonmark" }
commonmark-ext-autolink = { module = "org.commonmark:commonmark-ext-autolink", version.ref = "commonmark" }
commonmark-ext-footnotes = { module = "org.commonmark:commonmark-ext-footnotes", version.ref = "commonmark" }
commonmark-ext-image-attributes = { module = "org.commonmark:commonmark-ext-image-attributes", version.ref = "commonmark" }

# Phase I/J — Apache POI OOXML + XmlBeans + aalto StAX. All Apache-2.0.
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
poi-scratchpad = { module = "org.apache.poi:poi-scratchpad", version.ref = "poi" }
aalto-xml = { module = "com.fasterxml:aalto-xml", version.ref = "aaltoXml" }
xlsx-streamer = { module = "com.github.pjfanning:excel-streaming-reader", version.ref = "xlsxStreamer" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# oss-licenses A.1 — Licensee Gradle plugin for the build-time SPDX inventory.
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
# Phase B — KSP for Room's compile-time DAO generation. Apache-2.0.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
